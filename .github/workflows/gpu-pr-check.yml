name: "GPU PR Check"
permissions:
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  detect-gpu-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect GPU-related changes
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set +e
          python3 tools/check_gpu_changes.py --base "$BASE_REF"
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "GPU changes detected"
            echo "gpu_changes=true" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "No GPU changes detected"
            echo "gpu_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Error running check_gpu_changes.py (Exit code: $EXIT_CODE)"
            exit $EXIT_CODE
          fi

      - name: Find existing GPU PR comment
        id: gpu_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- gpu-pr-check -->'

      - name: Notify PR about missing test-cuda label
        if: steps.detect.outputs.gpu_changes == 'true' && contains(github.event.pull_request.labels.*.name, 'test-cuda') == false
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.gpu_comment.outputs.comment-id }}
          body: |
            :wave: I detected GPU/ONNX-related changes in this PR but the **`test-cuda`** label is missing.

            Please add the **`test-cuda`** label so the gated CUDA integration workflow can run on a GPU-enabled self-hosted runner and validate GPU changes.

            *How-to:* add the label in the PR sidebar or run `python tools/check_gpu_changes.py --base "${{ github.event.pull_request.base.ref }}"` to see which files triggered this.

            <!-- gpu-pr-check -->
          edit-mode: replace

      - name: Fail if GPU changes detected but PR not labeled
        if: steps.detect.outputs.gpu_changes == 'true' && contains(github.event.pull_request.labels.*.name, 'test-cuda') == false
        run: |
          echo "GPU/ONNX related changes detected in this PR but label 'test-cuda' is missing." >&2
          echo "Please add the 'test-cuda' label so CI can run GPU tests on an appropriate runner." >&2
          exit 1
